services:
  - type: web
    name: frontdesk
    env: node
    plan: free
    buildCommand: |
      cd web && npm ci --include=dev --legacy-peer-deps && npm run build && cd ../server && npm ci --legacy-peer-deps && npm run build
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: frontdesk-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3001
    healthCheckPath: /health
    autoDeploy: false

databases:
  - name: frontdesk-db
    plan: free
    databaseName: frontdesk
    user: frontdesk
